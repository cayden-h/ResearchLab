[project]
name = "researchbridge-api"
version = "0.1.0"
description = "FastAPI backend for the ResearchBridge product prototype."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

